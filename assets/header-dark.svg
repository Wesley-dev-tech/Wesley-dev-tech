<text x="64" y="414" font-family="IBM Plex Mono, Consolas, monospace" font-size="18" font-weight="400" fill="#D4895F" textLength="1416" lengthAdjust="spacingAndGlyphs">FULL STACK DEVELOPER IN OPLEIDING • WEBDESIGN • WEBSITES • WEBAPPLICATIES • SOFTWARE OP MAAT • AI AUTOMATISERING • </text><text x="1504" y="414" font-family="IBM Plex Mono, Consolas, monospace" font-size="18" font-weight="400" fill="#D4895F" textLength="1416" lengthAdjust="spacingAndGlyphs">FULL STACK DEVELOPER IN OPLEIDING • WEBDESIGN • WEBSITES • WEBAPPLICATIES • SOFTWARE OP MAAT • AI AUTOMATISERING • </text><text x="2944" y="414" font-family="IBM Plex Mono, Consolas, monospace" font-size="18" font-weight="400" fill="#D4895F" textLength="1416" lengthAdjust="spacingAndGlyphs">FULL STACK DEVELOPER IN OPLEIDING • WEBDESIGN • WEBSITES • WEBAPPLICATIES • SOFTWARE OP MAAT • AI AUTOMATISERING • </text>
