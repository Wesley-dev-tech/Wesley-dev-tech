<rect x="40" y="24" width="32" height="28" rx="4" fill="#D4895F"/>
<text x="44" y="44" font-family="IBM Plex Mono, Consolas, monospace" font-size="16" font-weight="700" fill="#161513" >WB</text><text x="86" y="44" font-family="IBM Plex Mono, Consolas, monospace" font-size="16" font-weight="400" fill="#A39D91" >WESLEY DEV &amp; TECH</text><text x="900" y="44" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" font-weight="400" fill="#A39D91" >BELGIUM / LEARNING BY BUILDING</text>
<circle cx="52" cy="107" r="4" fill="#D4895F" class="pulse"/>
<text x="66" y="112" font-family="IBM Plex Mono, Consolas, monospace" font-size="15" font-weight="400" fill="#D4895F" >FULL STACK &amp; AI AUTOMATION / IN TRAINING</text><text x="40" y="208" font-family="Schibsted Grotesk, Arial, sans-serif" font-size="94" font-weight="700" fill="#ECE7DD" letter-spacing="-5">WESLEY</text><text x="40" y="302" font-family="Schibsted Grotesk, Arial, sans-serif" font-size="94" font-weight="700" fill="#D4895F" letter-spacing="-5">DEV &amp; TECH.</text><text x="44" y="347" font-family="Schibsted Grotesk, Arial, sans-serif" font-size="24" font-weight="400" fill="#A39D91" >Business understanding. Built into code.</text>
<g transform="translate(752 100)">
 <rect width="408" height="251" rx="12" fill="#1F1D1A" stroke="#A39D91" stroke-opacity=".28"/>
 <path d="M0 42H408" stroke="#A39D91" stroke-opacity=".25"/>
 <circle cx="22" cy="21" r="4" fill="#D4895F"/><circle cx="38" cy="21" r="4" fill="#A39D91" opacity=".5"/><circle cx="54" cy="21" r="4" fill="#A39D91" opacity=".3"/>
<text x="80" y="26" font-family="IBM Plex Mono, Consolas, monospace" font-size="13" font-weight="400" fill="#A39D91" >wesley / learning lab</text>
<g class="scene-a">
<text x="22" y="78" font-family="IBM Plex Mono, Consolas, monospace" font-size="15" font-weight="400" fill="#D4895F" >// 01 / WEB DEVELOPMENT</text><text x="22" y="112" font-family="IBM Plex Mono, Consolas, monospace" font-size="17" font-weight="400" fill="#ECE7DD" >const developer = {</text><text x="40" y="144" font-family="IBM Plex Mono, Consolas, monospace" font-size="17" font-weight="400" fill="#ECE7DD" >name: &quot;Wesley&quot;,</text><text x="40" y="176" font-family="IBM Plex Mono, Consolas, monospace" font-size="17" font-weight="400" fill="#ECE7DD" >mindset: &quot;keep learning&quot;</text><text x="22" y="211" font-family="IBM Plex Mono, Consolas, monospace" font-size="18" font-weight="400" fill="#D4895F" >};</text>
</g><g class="scene-b">
<text x="22" y="78" font-family="IBM Plex Mono, Consolas, monospace" font-size="15" font-weight="400" fill="#D4895F" >-- 02 / MYSQL &amp; DATA</text><text x="22" y="112" font-family="IBM Plex Mono, Consolas, monospace" font-size="17" font-weight="400" fill="#ECE7DD" >SELECT project, skills</text><text x="22" y="144" font-family="IBM Plex Mono, Consolas, monospace" font-size="17" font-weight="400" fill="#ECE7DD" >FROM learning_projects</text><text x="22" y="176" font-family="IBM Plex Mono, Consolas, monospace" font-size="17" font-weight="400" fill="#ECE7DD" >WHERE curiosity = TRUE;</text><text x="22" y="211" font-family="IBM Plex Mono, Consolas, monospace" font-size="14" font-weight="400" fill="#A39D91" >-- learning by querying</text>
</g><g class="scene-c">
<text x="22" y="78" font-family="IBM Plex Mono, Consolas, monospace" font-size="15" font-weight="400" fill="#D4895F" >// 03 / AI AUTOMATION</text><text x="22" y="112" font-family="IBM Plex Mono, Consolas, monospace" font-size="17" font-weight="400" fill="#ECE7DD" >understand(process);</text><text x="22" y="144" font-family="IBM Plex Mono, Consolas, monospace" font-size="17" font-weight="400" fill="#ECE7DD" >explore(automation);</text><text x="22" y="176" font-family="IBM Plex Mono, Consolas, monospace" font-size="17" font-weight="400" fill="#ECE7DD" >build(test(improve()));</text><text x="22" y="211" font-family="IBM Plex Mono, Consolas, monospace" font-size="14" font-weight="400" fill="#A39D91" >// one useful step at a time</text>
</g><rect x="22" y="228" width="360" height="2" rx="1" fill="#D4895F" class="meter"/>
<rect x="377" y="20" width="7" height="13" fill="#D4895F" class="cursor"/>
</g>
<rect x="40" y="382" width="1120" height="52" rx="4" fill="#1F1D1A"/>
