<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" role="img" aria-label="Section divider">
<title>Wesley Dev &amp; Tech section divider</title>
<style>
  .copper { stroke: #9C4B26; fill: #9C4B26; }
  .stop { stop-color: #9C4B26; }
  @media (prefers-color-scheme: dark) {
    .copper { stroke: #D4895F; fill: #D4895F; }
    .stop { stop-color: #D4895F; }
