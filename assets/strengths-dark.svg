<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc"><title id="title">Business context, data thinking and practical output. The strengths I am bringing to development.</title><desc id="desc">Original Wesley Dev &amp; Tech artwork in warm copper. Animation is disabled when reduced motion is requested.</desc><rect width="1200" height="220" rx="10" fill="#161513"/><rect x="1" y="1" width="378" height="218" rx="8" fill="#1F1D1A" stroke="#A39D91" stroke-opacity=".2"/><text x="22" y="45" font-family="IBM Plex Mono, Consolas, monospace" font-size="15" font-weight="400" fill="#D4895F" >01</text><text x="22" y="91" font-family="Schibsted Grotesk, Arial, sans-serif" font-size="20" font-weight="700" fill="#ECE7DD" >BUSINESS CONTEXT</text><text x="22" y="137" font-family="Schibsted Grotesk, Arial, sans-serif" font-size="16" font-weight="400" fill="#A39D91" >Invoices. Reporting. Real workflows.</text><text x="22" y="169" font-family="Schibsted Grotesk, Arial, sans-serif" font-size="16" font-weight="400" fill="#A39D91" >Experience I bring into development.</text><rect x="411" y="1" width="378" height="218" rx="8" fill="#1F1D1A" stroke="#A39D91" stroke-opacity=".2"/><text x="432" y="45" font-family="IBM Plex Mono, Consolas, monospace" font-size="15" font-weight="400" fill="#D4895F" >02</text><text x="432" y="91" font-family="Schibsted Grotesk, Arial, sans-serif" font-size="20" font-weight="700" fill="#ECE7DD" >DATA THINKING</text><text x="432" y="137" font-family="Schibsted Grotesk, Arial, sans-serif" font-size="16" font-weight="400" fill="#A39D91" >MySQL. Relationships. Normalization.</text><text x="432" y="169" font-family="Schibsted Grotesk, Arial, sans-serif" font-size="16" font-weight="400" fill="#A39D91" >Making sense of how data fits together.</text><rect x="821" y="1" width="378" height="218" rx="8" fill="#1F1D1A" stroke="#A39D91" stroke-opacity=".2"/><text x="842" y="45" font-family="IBM Plex Mono, Consolas, monospace" font-size="15" font-weight="400" fill="#D4895F" >03</text><text x="842" y="91" font-family="Schibsted Grotesk, Arial, sans-serif" font-size="20" font-weight="700" fill="#ECE7DD" >PRACTICAL OUTPUT</text><text x="842" y="137" font-family="Schibsted Grotesk, Arial, sans-serif" font-size="16" font-weight="400" fill="#A39D91" >A website. A calculation. A PDF.</text><text x="842" y="169" font-family="Schibsted Grotesk, Arial, sans-serif" font-size="16" font-weight="400" fill="#A39D91" >Projects with something you can try.</text></svg>
