#5C574E" stroke-opacity=".4"/><g transform="translate(40 0)"><g class="train" fill="#F7F4EE" stroke="#9C4B26" stroke-width="1.5"><rect x="0" y="443" width="104" height="18" rx="4"/><path d="M10 448h12m6 0h12m6 0h12m6 0h12m6 0h12"/><circle cx="18" cy="462" r="2"/><circle cx="86" cy="462" r="2"/></g></g></g><g transform="translate(720 100)"><rect width="440" height="355" rx="12" fill="#EFE9DF" stroke="#5C574E" stroke-opacity=".28"/><path d="M0 42H440" stroke="#5C574E" stroke-opacity=".25"/><circle cx="22" cy="21" r="4" fill="#9C4B26"/><circle cx="38" cy="21" r="4" fill="#5C574E" opacity=".5"/><circle cx="54" cy="21" r="4" fill="#5C574E" opacity=".3"/><text x="80" y="26" font-family="IBM Plex Mono, Consolas, monospace" font-size="13" font-weight="400" fill="#5C574E" >wesley / developer.config</text><g class="scene-a"><text x="22" y="76" font-family="IBM Plex Mono, Consolas, monospace" font-size="15" font-weight="400" fill="#9C4B26" >// 01 / THE DEVELOPER</text><text x="22" y="112" font-family="IBM Plex Mono, Consolas, monospace" font-size="16" font-weight="400" fill="#1F1D1A" xml:space="preserve">const wesley = {</text><text x="22" y="141" font-family="IBM Plex Mono, Consolas, monospace" font-size="16" font-weight="400" fill="#1F1D1A" xml:space="preserve">  location: &quot;Balen, Belgium&quot;,</text><text x="22" y="170" font-family="IBM Plex Mono, Consolas, monospace" font-size="16" font-weight="400" fill="#1F1D1A" xml:space="preserve">  school: &quot;SyntraPXL&quot;,</text><text x="22" y="199" font-family="IBM Plex Mono, Consolas, monospace" font-size="16" font-weight="400" fill="#1F1D1A" xml:space="preserve">  training: &quot;Full Stack &amp; AI&quot;,</text><text x="22" y="228" font-family="IBM Plex Mono, Consolas, monospace" font-size="16" font-weight="400" fill="#1F1D1A" xml:space="preserve">  background: &quot;finance&quot;,</text><text x="22" y="257" font-family="IBM Plex Mono, Consolas, monospace" font-size="16" font-weight="400" fill="#1F1D1A" xml:space="preserve">  mindset: &quot;keep learning&quot;</text><text x="22" y="286" font-family="IBM Plex Mono, Consolas, monospace" font-size="16" font-weight="400" fill="#1F1D1A" xml:space="preserve">};</text></g><g class="scene-b"><text x="22" y="76" font-family="IBM Plex Mono, Consolas, monospace" font-size="15" font-weight="400" fill="#9C4B26" >// 02 / LEARNING TOOLBOX</text><text x="22" y="112" font-family="IBM Plex Mono, Consolas, monospace" font-size="16" font-weight="400" fill="#1F1D1A" xml:space="preserve">const learning = {</text><text x="22" y="141" font-family="IBM Plex Mono, Consolas, monospace" font-size="16" font-weight="400" fill="#1F1D1A" xml:space="preserve">  frontend: [&quot;HTML&quot;, &quot;CSS&quot;, &quot;JS&quot;],</text><text x="22" y="170" font-family="IBM Plex Mono, Consolas, monospace" font-size="16" font-weight="400" fill="#1F1D1A" xml:space="preserve">  data: [&quot;MySQL&quot;, &quot;SQL joins&quot;],</text><text x="22" y="199" font-family="IBM Plex Mono, Consolas, monospace" font-size="16" font-weight="400" fill="#1F1D1A" xml:space="preserve">  layout: [&quot;Flexbox&quot;, &quot;Grid&quot;],</text><text x="22" y="228" font-family="IBM Plex Mono, Consolas, monospace" font-size="16" font-weight="400" fill="#1F1D1A" xml:space="preserve">  workflow: [&quot;Git&quot;, &quot;Scrum&quot;],</text><text x="22" y="257" font-family="IBM Plex Mono, Consolas, monospace" font-size="16" font-weight="400" fill="#1F1D1A" xml:space="preserve">  next: [&quot;TypeScript&quot;, &quot;APIs&quot;]</text><text x="22" y="286" font-family="IBM Plex Mono, Consolas, monospace" font-size="16" font-weight="400" fill="#1F1D1A" xml:space="preserve">};</text></g><g class="scene-c"><text x="22" y="76" font-family="IBM Plex Mono, Consolas, monospace" font-size="15" font-weight="400" fill="#9C4B26" >// 03 / HOW I APPROACH CODE</text><text x="22" y="112" font-family="IBM Plex Mono, Consolas, monospace" font-size="16" font-weight="400" fill="#1F1D1A" xml:space="preserve">understand(theProblem);</text><text x="22" y="141" font-family="IBM Plex Mono, Consolas, monospace" font-size="16" font-weight="400" fill="#1F1D1A" xml:space="preserve">build(aSmallSolution);</text><text x="22" y="170" font-family="IBM Plex Mono, Consolas, monospace" font-size="16" font-weight="400" fill="#1F1D1A" xml:space="preserve">test(theResult);</text><text x="22" y="199" font-family="IBM Plex Mono, Consolas, monospace" font-size="16" font-weight="400" fill="#1F1D1A" xml:space="preserve">learn(fromFeedback);</text><text x="22" y="228" font-family="IBM Plex Mono, Consolas, monospace" font-size="16" font-weight="400" fill="#1F1D1A" xml:space="preserve">improve(theCode);</text><text x="22" y="257" font-family="IBM Plex Mono, Consolas, monospace" font-size="16" font-weight="400" fill="#1F1D1A" xml:space="preserve">repeat();</text><text x="22" y="286" font-family="IBM Plex Mono, Consolas, monospace" font-size="16" font-weight="400" fill="#5C574E" xml:space="preserve">// AI supports understanding.</text></g><rect x="22" y="334" width="396" height="2" rx="1" fill="#9C4B26" class="meter"/><rect x="409" y="20" width="7" height="13" fill="#9C4B26" class="cursor"/></g><rect x="40" y="490" width="1120" height="52" rx="4" fill="#EFE9DF"/><g clip-path="url(#ticker-clip)"><g class="ticker"><text x="64" y="522" font-family="IBM Plex Mono, Consolas, monospace" font-size="18" font-weight="400" fill="#9C4B26" textLength="1416" lengthAdjust="spacingAndGlyphs">FULL STACK DEVELOPER IN TRAINING • WEB DESIGN • WEBSITES • WEB APPLICATIONS • CUSTOM SOFTWARE • AI AUTOMATION • </text><text x="1504" y="522" font-family="IBM Plex Mono, Consolas, monospace" font-size="18" font-weight="400" fill="#9C4B26" textLength="1416" lengthAdjust="spacingAndGlyphs">FULL STACK DEVELOPER IN TRAINING • WEB DESIGN • WEBSITES • WEB APPLICATIONS • CUSTOM SOFTWARE • AI AUTOMATION • </text><text x="2944" y="522" font-family="IBM Plex Mono, Consolas, monospace" font-size="18" font-weight="400" fill="#9C4B26" textLength="1